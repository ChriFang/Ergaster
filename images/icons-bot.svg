<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" role="img">
  <title>bot</title>
  <defs>
    <!-- 右下角缺口：在星芒外缘再外扩 2.5，把头部轮廓切出等宽留白 -->
    <mask id="notch" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <path d="M71 51.5C71 55.5 75 61 80.5 61C75 61 71 66.5 71 71C71 66.5 67 61 61.5 61C67 61 71 55.5 71 51.5Z"
            fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- 头部轮廓：右下角被 mask 挖出缺口 -->
  <rect x="8" y="18" width="68" height="48" rx="16"
        stroke="currentColor" stroke-width="5" mask="url(#notch)"/>

  <!-- 眼睛 -->
  <rect x="25" y="33" width="10" height="11" rx="3" fill="currentColor"/>
  <rect x="47" y="33" width="10" height="11" rx="3" fill="currentColor"/>

  <!-- 嘴巴 -->
  <rect x="33" y="52" width="18" height="7" rx="3.5" fill="currentColor"/>

  <!-- 星芒：嵌在右下角缺口中 -->
  <path fill="currentColor" d="M71 51.5C71 55.5 75 61 80.5 61C75 61 71 66.5 71 71C71 66.5 67 61 61.5 61C67 61 71 55.5 71 51.5Z"/>
</svg>
